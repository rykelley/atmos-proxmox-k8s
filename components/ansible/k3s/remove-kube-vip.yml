---
# Narrow cleanup: remove leftover kube-vip and rewrite kubeconfig to the
# first-server API endpoint. Does not reinstall or rejoin k3s.

- name: Remove kube-vip if previously installed
  hosts: k3s_servers
  become: true
  roles:
    - kube-vip

- name: Fetch kubeconfig from the bootstrap server
  hosts: k3s_servers[0]
  become: true
  tasks:
    - name: Read remote kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: _k3s_kubeconfig

    - name: Compute kubeconfig content pointed at the control-plane endpoint
      delegate_to: localhost
      become: false
      ansible.builtin.set_fact:
        _kubeconfig_content: >-
          {{
            (_k3s_kubeconfig.content | b64decode)
            | regex_replace('https://127\.0\.0\.1:6443', 'https://' ~ control_plane_endpoint ~ ':' ~ (api_port | string))
          }}

    - name: Ensure local kubeconfig directories exist
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ kubeconfig_local_path | dirname }}"
        - "{{ playbook_dir }}/{{ kubeconfig_fetch_dir }}"

    - name: Write kubeconfig to the stable path used by Helmfile and a local copy
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        dest: "{{ item }}"
        mode: "0600"
        content: "{{ _kubeconfig_content }}"
      loop:
        - "{{ kubeconfig_local_path }}"
        - "{{ playbook_dir }}/{{ kubeconfig_fetch_dir }}/kubeconfig"

    - name: Report kubeconfig location
      delegate_to: localhost
      become: false
      ansible.builtin.debug:
        msg: "Kubeconfig written to {{ kubeconfig_local_path }} (server https://{{ control_plane_endpoint }}:{{ api_port }})"
