# Defaults for standalone runs. Atmos overrides these via --extra-vars using the
# values from stacks/catalog/cluster.yaml (extra-vars take highest precedence).

# Versions
k3s_version: "v1.36.2+k3s1"

# API endpoint for joins / kubeconfig / Cilium. This is the first server's node
# IP (not a floating VIP — kube-vip is not used).
control_plane_endpoint: "10.10.1.31"
api_port: 6443

# Interface + former floating VIP(s) for cleanup of leftover kube-vip /32s.
kube_vip_interface: "eth0"
kube_vip_legacy_ips:
  - "10.10.1.30"

# Kubernetes networking (Cilium owns CNI; flannel/kube-proxy disabled)
pod_cidr: "10.42.0.0/16"
service_cidr: "10.43.0.0/16"
cluster_dns: "10.43.0.10"

# k3s installer
k3s_install_url: "https://get.k3s.io"
k3s_server_disable:
  - traefik
  - servicelb

# Where the fetched kubeconfig is written on the control node (relative to the
# component dir). Set by site.yml.
kubeconfig_fetch_dir: "fetched"

# Stable local path the fetched kubeconfig is written to (what Helmfile/kubectl
# use via KUBECONFIG). Overridden per-cluster in the stack so cluster-A and
# cluster-B don't clobber each other (edge uses ~/.kube/atmos-k3s-edge.yaml).
kubeconfig_local_path: "{{ lookup('env', 'HOME') }}/.kube/atmos-k3s.yaml"
