---
- name: Ensure required APT packages are present
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - open-iscsi
      - nfs-common
      - apparmor
      - apparmor-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

# qemu-guest-agent only makes sense on Proxmox VMs. Bare-metal nodes (e.g. the
# GPU box) set is_vm=false in inventory so this is skipped there.
- name: Ensure qemu-guest-agent is present on VMs
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  when: is_vm | default(true)

- name: Enable qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  when: is_vm | default(true)

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap entries from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'

- name: Load required kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Apply sysctl settings for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-k3s.conf
    sysctl_set: true
    reload: true
  loop:
    - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { name: "net.ipv4.ip_forward", value: "1" }
    - { name: "net.ipv6.conf.all.forwarding", value: "1" }
    - { name: "fs.inotify.max_user_instances", value: "8192" }
    - { name: "fs.inotify.max_user_watches", value: "524288" }

# Explicitly disable unattended auto-reboot. The stock Ubuntu file leaves
# Automatic-Reboot commented (defaults false), but a drift to "true" would
# reboot every control-plane node after a kernel upgrade and drop the VIP.
# Today's outage was hypervisor-initiated, but this still closes that footgun.
- name: Pin unattended-upgrades to never auto-reboot
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52k3s-no-auto-reboot
    mode: "0644"
    content: |
      // Managed by Ansible (Atmos). Do not auto-reboot after upgrades.
      // Kernel installs are fine; schedule reboots deliberately, one node at a time.
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "false";

# needrestart's Ubuntu APT hook defaults to auto-restarting services. Keep
# that for userspace daemons, but never let it trigger a host reboot for a
# pending kernel — that is an operator decision on HA etcd nodes.
- name: Prefer listing pending kernel reboots over auto-rebooting
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/99-k3s-no-kernel-reboot.conf
    mode: "0644"
    content: |
      # Managed by Ansible (Atmos).
      # 'i' = interactive/list for kernel; services still follow Ubuntu APT defaults.
      $nrconf{kernelhints} = -1;
      $nrconf{ucodehints} = 0;
