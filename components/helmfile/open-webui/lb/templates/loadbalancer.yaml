# Dedicated Cilium LoadBalancer IPAM + L2 announcement for Open WebUI.
# Cluster-scoped Cilium CRDs; the serviceSelector targets only the Open WebUI
# Service so this pool stays independent of filament (.240), Hubble (.241),
# vLLM (.242), Grafana (.245), and cilium-ingress (.248).
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: {{ .Values.loadBalancer.poolName }}
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: networking
    app.kubernetes.io/part-of: open-webui
spec:
  blocks:
    - start: {{ .Values.loadBalancer.ip | quote }}
      stop: {{ .Values.loadBalancer.ip | quote }}
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: open-webui
      app.kubernetes.io/component: open-webui
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: {{ .Values.loadBalancer.poolName }}
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: networking
    app.kubernetes.io/part-of: open-webui
spec:
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: open-webui
      app.kubernetes.io/component: open-webui
  interfaces:
    - {{ printf "^%s$" .Values.loadBalancer.interface | quote }}
  loadBalancerIPs: true
