# vLLM STAGING (cluster-A, GPU) — the canary side of the Kargo pipeline.
# Renders an Argo Rollouts Rollout with a Prometheus-gated canary.
#
# The stage-specific values live in apps/vllm-pipeline/chart/env/staging.yaml
# (the promotable unit the Kargo Warehouse watches). `targetRevision` starts at
# `main`; once you begin promoting, Kargo pins it to the verified Freight commit
# by pushing a small commit that rewrites the field below.
#
# The kargo.akuity.io/authorized-stage annotation consents to Kargo's `staging`
# Stage (project vllm-promo) updating this Application via the argocd-update step.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-pipeline-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    kargo.akuity.io/authorized-stage: vllm-promo:staging
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rykelley/atmos-proxmox-k8s.git
    # Kargo pins this to a Freight commit SHA on promotion (starts at main).
    targetRevision: 0254b6b25e662c5bb45ea99c455234f5f20a892b
    path: apps/vllm-pipeline/chart
    helm:
      # Chart defaults (values.yaml) + the staging overlay, both read at the
      # pinned targetRevision.
      valueFiles:
        - env/staging.yaml
      # Phase 2: free shared 16GB VRAM for model-promotion Gemma 4 E4B.
      # Remove this parameter (or set "1") when restoring the canary pipeline.
      parameters:
        - name: replicas
          value: "0"
  destination:
    server: https://kubernetes.default.svc
    namespace: vllm-pipeline
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
