# vLLM STAGING (cluster-A, GPU) — the canary side of the Kargo pipeline.
# Renders an Argo Rollouts Rollout with a Prometheus-gated canary.
#
# VRAM math (16 GB, time-sliced/shared): the existing Helmfile vLLM (3B @ 0.55 ≈
# 8.8 GB) + embeddings (0.20 ≈ 3.2 GB) leave only ~4 GB free. A canary briefly
# runs TWO pods, so staging must be tiny: Qwen2.5-0.5B at 0.15 util (~2.4 GB/pod)
# keeps both stable+canary inside the free VRAM. A 1.5B model does NOT fit here
# (weights alone exceed the budget -> "No available memory for the cache blocks").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-pipeline-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rykelley/atmos-proxmox-k8s.git
    targetRevision: main
    path: apps/vllm-pipeline/chart
    helm:
      values: |
        namespace: vllm-pipeline
        image:
          repository: vllm/vllm-openai
          tag: "v0.11.0"
        model:
          name: "Qwen/Qwen2.5-0.5B-Instruct"
          maxModelLen: 2048
          gpuMemoryUtilization: "0.15"
        gpu:
          enabled: true
        service:
          type: ClusterIP
        rollout:
          enabled: true
        analysis:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: vllm-pipeline
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
