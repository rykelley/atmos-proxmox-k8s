# zot - OCI-native container registry for the cluster's own images.
#
# Exposed on 10.10.1.252:5000 over PLAIN HTTP (pool in gitops/networking).
# .249-.251 were unavailable: two live DHCP devices and the cluster-B
# Prometheus VIP.
# There is no authentication: anyone on 10.10.1.0/24 can push and overwrite
# tags, so keep this off any routable segment. Add htpasswd auth via the
# chart's mountSecret/secretFiles if that stops being acceptable.
#
# For k3s to pull from it, every node needs /etc/rancher/k3s/registries.yaml
# marking this endpoint as an HTTP mirror:
#   atmos ansible playbook k3s-registries -s prod
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zot
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://zotregistry.dev/helm-charts
    chart: zot
    targetRevision: 0.1.122
    helm:
      releaseName: zot
      values: |
        replicaCount: 1
        # persistence=true switches the chart from a Deployment to a
        # StatefulSet with a volumeClaimTemplate.
        persistence: true
        pvc:
          create: true
          name: zot-data
          accessModes: ["ReadWriteMany"]
          storage: 100Gi
          # NAS-backed so images survive losing the node the pod landed on.
          storageClassName: nfs-client
        service:
          type: LoadBalancer
          port: 5000
          annotations:
            io.cilium/lb-ipam-ips: "10.10.1.252"
        mountConfig: true
        configFiles:
          config.json: |-
            {
              "storage": {
                "rootDirectory": "/var/lib/registry",
                "dedupe": true,
                "gc": true,
                "gcDelay": "1h",
                "gcInterval": "24h"
              },
              "http": {
                "address": "0.0.0.0",
                "port": "5000",
                "externalURL": "http://10.10.1.252:5000",
                "readTimeout": "900s",
                "writeTimeout": "900s"
              },
              "log": { "level": "info" },
              "extensions": {
                "ui": { "enable": true },
                "search": { "enable": true },
                "metrics": {
                  "enable": true,
                  "prometheus": { "path": "/metrics" }
                }
              }
            }
        # Scraped by kube-prometheus-stack, which watches ServiceMonitors in
        # every namespace (serviceMonitorSelectorNilUsesHelmValues: false).
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            interval: "30s"
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: zot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
