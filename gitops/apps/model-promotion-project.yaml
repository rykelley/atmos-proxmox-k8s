# AppProject for the metric-gated model-promotion pipeline.
# Allows the hub Argo CD (staging) to deploy into in-cluster + cluster-b.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: model-promotion
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: model-promotion
spec:
  description: Digest-pinned vLLM promotion across staging (homelab-1) and prod (homelab-2 / cluster-b).
  sourceRepos:
    - https://github.com/rykelley/atmos-proxmox-k8s.git
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - namespace: vllm-promo
      server: https://kubernetes.default.svc
    - namespace: vllm-promo
      name: cluster-b
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: monitoring
      name: cluster-b
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
