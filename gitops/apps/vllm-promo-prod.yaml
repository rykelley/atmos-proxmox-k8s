# vLLM promo server — prod (homelab-2 / Argo destination name: cluster-b).
#
# SAFETY: automated sync is OFF. Root app-of-apps will create this Application
# object after merge; do NOT click Sync / enable auto-sync until you explicitly
# confirm a prod deploy (VRAM freer + model download are intentional).
#
# Model: google/gemma-4-26B-A4B-it @ bitsandbytes, maxLen 4096 (16GB-tight).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-promo-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    model-promotion.rykelley.com/phase: "4"
    model-promotion.rykelley.com/cluster: prod
    model-promotion.rykelley.com/apply-gate: "requires-explicit-confirmation"
    # Phase 5+: Kargo prod Stage may update targetRevision via argocd-update.
    kargo.akuity.io/authorized-stage: vllm-promo:prod
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  sources:
    - repoURL: https://github.com/rykelley/atmos-proxmox-k8s.git
      targetRevision: main
      path: model-promotion/charts/vllm-server
      helm:
        releaseName: vllm-promo
        valueFiles:
          - $values/model-promotion/envs/prod/values.yaml
    - repoURL: https://github.com/rykelley/atmos-proxmox-k8s.git
      targetRevision: main
      ref: values
  destination:
    name: cluster-b
    namespace: vllm-promo
  # Manual sync only — no automated prune/selfHeal.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
