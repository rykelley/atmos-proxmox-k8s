# kube-prometheus-stack on staging (homelab-1).
# Values live in model-promotion/ (source of truth for the promotion pipeline).
# Chart pin: 87.17.0 — matches the previously inline-managed release.
#
# Argo CD multi-source: Helm chart + $values ref into this Git repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 87.17.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/model-promotion/monitoring/kube-prometheus-stack/staging-values.yaml
    - repoURL: https://github.com/rykelley/atmos-proxmox-k8s.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # kube-prometheus-stack CRDs are too large for client-side apply.
      - ServerSideApply=true
