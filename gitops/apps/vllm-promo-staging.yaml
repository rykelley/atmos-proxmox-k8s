# vLLM promo server — staging only (homelab-1 / in-cluster).
# Chart + env values live under model-promotion/. Prod Application comes in Phase 4+.
#
# Multi-source: chart path + $values ref so envs/staging/values.yaml is outside the chart tree.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-promo-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    model-promotion.rykelley.com/phase: "2"
    model-promotion.rykelley.com/cluster: staging
spec:
  project: default
  sources:
    - repoURL: https://github.com/rykelley/atmos-proxmox-k8s.git
      targetRevision: main
      path: model-promotion/charts/vllm-server
      helm:
        releaseName: vllm-promo
        valueFiles:
          - $values/model-promotion/envs/staging/values.yaml
    - repoURL: https://github.com/rykelley/atmos-proxmox-k8s.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vllm-promo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
