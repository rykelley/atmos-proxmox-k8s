# vLLM PROD (cluster-B, CPU) — the promotion TARGET of the Kargo pipeline.
# A plain Deployment serving a tiny CPU model, exposed on the LAN at 10.10.1.246.
#
# The stage-specific values live in apps/vllm-pipeline/chart/env/prod.yaml. Kargo
# promotes by pinning `targetRevision` below to the SAME Freight commit the
# staging canary verified, so prod deploys env/prod.yaml at that exact commit.
#
# The kargo.akuity.io/authorized-stage annotation consents to Kargo's `prod`
# Stage (project vllm-promo) updating this Application via the argocd-update step.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-pipeline-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    kargo.akuity.io/authorized-stage: vllm-promo:prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rykelley/atmos-proxmox-k8s.git
    # Kargo pins this to a Freight commit SHA on promotion (starts at main).
    targetRevision: main
    path: apps/vllm-pipeline/chart
    helm:
      # Chart defaults (values.yaml) + the prod overlay, both read at the pinned
      # targetRevision.
      valueFiles:
        - env/prod.yaml
  destination:
    # Registered by scripts/register-cluster-b-argocd.sh (Phase 2).
    name: cluster-b
    namespace: vllm-pipeline
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
