# vLLM PROD (cluster-B, CPU) — the promotion TARGET of the Kargo pipeline.
# A plain Deployment serving a tiny CPU model, exposed on the LAN at 10.10.1.246.
# Kargo promotes by bumping image.tag / model here once the staging canary passes.
#
# Uses the official CPU image (vllm/vllm-openai-cpu), which auto-detects the CPU
# platform. Sized for cluster-B's 8 GiB nodes: modest requests + a capped CPU
# KV cache (VLLM_CPU_KVCACHE_SPACE) so weights + cache fit in RAM.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-pipeline-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rykelley/atmos-proxmox-k8s.git
    targetRevision: main
    path: apps/vllm-pipeline/chart
    helm:
      values: |
        namespace: vllm-pipeline
        image:
          # Official CPU build (auto-detects CPU platform). Kargo bumps this tag.
          repository: vllm/vllm-openai-cpu
          tag: "v0.26.0-x86_64"
        model:
          name: "Qwen/Qwen2.5-0.5B-Instruct"
          maxModelLen: 2048
        gpu:
          enabled: false
        replicas: 1
        # Fits cluster-B's 2-core / 8 GiB nodes with headroom for kube-system.
        resources:
          requests:
            cpu: "1"
            memory: 3Gi
          limits:
            cpu: "2"
            memory: 6Gi
        # tmpfs /dev/shm counts against pod memory; keep it small on CPU.
        shmSize: 1Gi
        # Cap the CPU KV cache (GiB) so weights + cache stay within the limit.
        extraEnv:
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "2"
        service:
          type: LoadBalancer
        loadBalancer:
          enabled: true
          ip: "10.10.1.246"
          interface: "eth0"
        rollout:
          enabled: false
        analysis:
          enabled: false
  destination:
    # Registered by scripts/register-cluster-b-argocd.sh (Phase 2).
    name: cluster-b
    namespace: vllm-pipeline
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
