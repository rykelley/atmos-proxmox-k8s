# LAN "ingress" for the Kargo API/UI via Cilium Gateway API (this cluster has no
# traditional ingress controller — k3s traefik is off, Cilium serves Gateway API).
# Mirrors the filament / hubble-ui gateways: a Gateway on a dedicated Cilium L2
# LoadBalancer IP with an HTTPRoute to the backing Service.
#
# IP map on 10.10.1.0/24: .240 filament, .241 hubble, .242 vLLM, .243 open-webui,
# .244 argocd, .245 grafana, .246 vllm-pipeline-prod (cluster-B), .247 kargo.
#
# Applied by `atmos workflow deploy-kargo` (kubectl, not Argo CD) since Kargo is
# Helmfile-managed. The kargo-api Service listens on port 80 (TLS disabled).
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kargo
  namespace: kargo
spec:
  gatewayClassName: cilium
  # Cilium copies this onto the LoadBalancer Service it generates for the
  # Gateway, so LB-IPAM assigns this specific address from the pool below.
  infrastructure:
    annotations:
      io.cilium/lb-ipam-ips: "10.10.1.247"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo-api
  namespace: kargo
spec:
  parentRefs:
    - name: kargo
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kargo-api
          port: 80
---
# Cilium LB IPAM + L2 announcement for THIS gateway's generated Service only.
# Cilium labels that Service io.cilium.gateway/owning-gateway=kargo; scoping to
# that name keeps this pool's single IP (.247) independent of the other gateway
# pools (filament/hubble at .240-.241), whose ranges must not overlap this one.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: kargo-gateway-pool
spec:
  blocks:
    - start: "10.10.1.247"
      stop: "10.10.1.247"
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: kargo
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: kargo-gateway-pool
spec:
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: kargo
  interfaces:
    # Match the LAN NIC on any elected announcer: VMs use eth0, the bare-metal
    # GPU node (k3s-gpu1) uses eno1.
    - "^(eth0|eno1)$"
  loadBalancerIPs: true
