# Kargo pipeline: promote the vLLM model config from `staging` (cluster-A, GPU
# canary) to `prod` (cluster-B, CPU).
#
# WHAT IS PROMOTED: a Git commit, not an image tag. staging and prod use
# different vLLM images (CUDA vs CPU) with unrelated tag schemes, so a single
# image tag can't flow across both. Instead the Warehouse watches
# apps/vllm-pipeline/, so any config "release" (e.g. bumping the model in
# env/staging.yaml + env/prod.yaml) produces Freight = a commit. Promotion pins
# each stage's Argo CD Application targetRevision to that commit; each cluster
# then renders its OWN env values file at that commit.
#
# FLOW: Warehouse -> staging (canary + verification) -> prod.
# All resources live in the `vllm-promo` namespace created by kargo/project.yaml.
---
# Verification gate run by Kargo AFTER a successful promotion to `staging`, on
# top of the Rollout's own canary analysis. This is an Argo Rollouts
# AnalysisTemplate (CRDs installed by the argo-rollouts app on cluster-A). It
# must live in the Project namespace because Kargo creates the AnalysisRun here;
# the PromQL targets the workload namespace by label, so it works cross-namespace.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: vllm-canary-gate
  namespace: vllm-promo
spec:
  metrics:
    - name: staging-up
      interval: 30s
      count: 3
      failureLimit: 1
      # The staging pods' scrape targets must be `up` for 3 consecutive checks.
      successCondition: "result[0] >= 1"
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc.cluster.local:9090
          query: |
            avg(up{namespace="vllm-pipeline"})
---
# Watches this repo's pipeline path. A commit touching apps/vllm-pipeline/ (chart
# or env values) produces new Freight. Promotion commits only touch gitops/apps/
# (outside includePaths), so they never create a feedback-loop Freight.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: vllm-config
  namespace: vllm-promo
spec:
  subscriptions:
    - git:
        repoURL: https://github.com/rykelley/atmos-proxmox-k8s.git
        commitSelectionStrategy: NewestFromBranch
        branch: main
        includePaths:
          - apps/vllm-pipeline
---
# Reusable promotion process, identical for every stage: clone the repo, rewrite
# the stage's Argo CD Application targetRevision to the Freight commit, push, then
# tell Argo CD to sync and register a health check against that revision.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote-vllm
  namespace: vllm-promo
spec:
  vars:
    - name: gitopsRepo
      value: https://github.com/rykelley/atmos-proxmox-k8s.git
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitopsRepo }}
        checkout:
          - branch: main
            path: ./repo
    - uses: yaml-update
      as: update
      config:
        path: ./repo/gitops/apps/vllm-pipeline-${{ ctx.stage }}.yaml
        updates:
          - key: spec.source.targetRevision
            value: ${{ commitFrom(vars.gitopsRepo).ID }}
    - uses: git-commit
      as: commit
      config:
        path: ./repo
        message: ${{ task.outputs.update.commitMessage }}
    - uses: git-push
      config:
        path: ./repo
    - uses: argocd-update
      config:
        apps:
          - name: vllm-pipeline-${{ ctx.stage }}
            sources:
              - repoURL: ${{ vars.gitopsRepo }}
                desiredRevision: ${{ commitFrom(vars.gitopsRepo).ID }}
---
# STAGING: accepts new Freight directly from the Warehouse. After promotion,
# Kargo runs the verification AnalysisTemplate; only verified Freight becomes
# eligible for prod.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: vllm-promo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: vllm-config
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - task:
            name: promote-vllm
          as: promo
  verification:
    analysisTemplates:
      - name: vllm-canary-gate
---
# PROD: only accepts Freight already verified in `staging`. No verification of
# its own — the argocd-update health check (prod Application Healthy on
# cluster-B) is the gate.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: vllm-promo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: vllm-config
      sources:
        stages:
          - staging
  promotionTemplate:
    spec:
      steps:
        - task:
            name: promote-vllm
          as: promo
