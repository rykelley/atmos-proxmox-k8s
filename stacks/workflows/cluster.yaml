# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json
#
# End-to-end orchestration workflows.
# Run with:  atmos workflow deploy-cluster -f cluster

workflows:
  deploy-cluster:
    description: "Provision VMs, install HA k3s (API on first server IP), then deploy Cilium and Kyverno."
    steps:
      - name: provision-vms
        command: terraform apply proxmox-vms -s prod -auto-approve
      - name: wait-for-ssh
        type: shell
        command: |
          echo "Waiting 60s for cloud-init / SSH on the new VMs..."
          sleep 60
      - name: install-k3s
        command: ansible playbook k3s -s prod
      - name: deploy-cilium
        command: helmfile apply cilium -s prod
      - name: deploy-kyverno
        # --skip-diff-on-install: the kyverno-policies chart renders ClusterPolicy
        # CRs whose CRDs are installed by the kyverno chart in the same apply.
        # `helmfile apply` diffs all releases before installing, so without this
        # the kyverno-policies diff fails with "no matches for kind ClusterPolicy".
        command: helmfile apply kyverno -s prod -- --skip-diff-on-install
      - name: deploy-filament-app
        # Requires the `filament-db` Secret to exist (namespace is created by Helm).
        # (see README). --skip-diff-on-install avoids diffing Cilium/Gateway CRs
        # whose CRDs were installed by earlier steps.
        command: helmfile apply filament-app -s prod -- --skip-diff-on-install
      - name: deploy-hubble-ui
        # Reuses the LB IP pool + L2 announcement policy from filament-app, so
        # this must come after it.
        command: helmfile apply hubble-ui -s prod -- --skip-diff-on-install

  setup-gpu-os:
    description: "Bare-metal GPU host bring-up via Ansible only (no Terraform): common OS prep, passwordless sudo, NVIDIA driver check, nvidia-container-toolkit, then join k3s. Scoped to the k3s_gpu group."
    steps:
      # --limit k3s_gpu scopes every play to the GPU node: Common OS prep, the
      # GPU host role, and the agent join all run; the server/kubeconfig plays
      # have no hosts under the limit and are skipped. This is the ansible
      # analogue of `deploy-cluster` (which uses Terraform to build the VM OS).
      #
      # First-time bring-up on a host without passwordless sudo: append
      # `--ask-become-pass` here once (see roles/gpu tasks).
      - name: prepare-gpu-host
        command: ansible playbook k3s -s prod -- --limit k3s_gpu

  deploy-gpu:
    description: "Join the bare-metal GPU node (tainted agent), install the NVIDIA GPU Operator, then deploy vLLM."
    steps:
      # Idempotent full playbook: joins/labels/taints the GPU agent. The k3s
      # install tasks are guarded by `creates:` so existing nodes are untouched.
      - name: join-gpu-node
        command: ansible playbook k3s -s prod
      - name: deploy-gpu-operator
        # --skip-diff-on-install: the operator installs its own CRDs
        # (ClusterPolicy/NodeFeatureDiscovery) in the same apply.
        command: helmfile apply gpu-operator -s prod -- --skip-diff-on-install
      - name: deploy-vllm
        command: helmfile apply vllm -s prod -- --skip-diff-on-install

  deploy-open-webui:
    description: "Deploy Open WebUI on the hub cluster, backed by hub + edge vLLM (Blackwell GPUs). Requires vLLM and nfs-client already up."
    steps:
      - name: deploy-open-webui
        command: helmfile apply open-webui -s prod -- --skip-diff-on-install

  deploy-monitoring:
    description: "Deploy the observability stack (Prometheus + Grafana + Loki + Alloy) plus the GPU/vLLM dashboards, DCGM scrape, and Grafana/cilium-ingress LB pools. Requires the grafana-admin Secret (see components/helmfile/monitoring/helmfile.yaml.gotmpl) and the GPU Operator (DCGM exporter) already up."
    steps:
      - name: deploy-monitoring
        # --skip-diff-on-install: the monitoring-extras release renders a
        # ServiceMonitor whose CRD is installed by kube-prometheus-stack in the
        # same apply.
        command: helmfile apply monitoring -s prod -- --skip-diff-on-install

  destroy-cluster:
    description: "Tear down the cluster in reverse order (removes the VMs)."
    steps:
      - name: destroy-monitoring
        command: helmfile destroy monitoring -s prod
        # Best-effort: the cluster may already be gone.
      - name: destroy-open-webui
        command: helmfile destroy open-webui -s prod
        # Best-effort: the cluster may already be gone.
      - name: destroy-vllm
        command: helmfile destroy vllm -s prod
        # Best-effort: the cluster may already be gone.
      - name: destroy-gpu-operator
        command: helmfile destroy gpu-operator -s prod
        # Best-effort: the cluster may already be gone.
      - name: destroy-hubble-ui
        command: helmfile destroy hubble-ui -s prod
        # Best-effort: the cluster may already be gone.
      - name: destroy-filament-app
        command: helmfile destroy filament-app -s prod
        # Best-effort: the cluster may already be gone.
      - name: destroy-kyverno
        command: helmfile destroy kyverno -s prod
      - name: destroy-cilium
        command: helmfile destroy cilium -s prod
      - name: destroy-vms
        command: terraform destroy proxmox-vms -s prod -auto-approve

  deploy-app:
    description: "Deploy/redeploy just the filament tracker app (filament-db secret must exist)."
    steps:
      - name: deploy-filament-app
        command: helmfile apply filament-app -s prod -- --skip-diff-on-install

  plan-vms:
    description: "Plan the Proxmox VM changes only."
    steps:
      - name: plan
        command: terraform plan proxmox-vms -s prod

  deploy-cluster-b:
    description: "Provision cluster-B (edge) on the standalone Proxmox host pve2 (10.10.1.82): 3-server HA k3s (API on first server 10.10.1.51), then Cilium. GPU node k3s-gpu2 is joined via setup-gpu-os-b / deploy-gpu-b. Requires PROXMOX_VE_B_* in .env and template VMID 9000 on pve2."
    steps:
      - name: provision-vms
        command: terraform apply proxmox-vms -s edge -auto-approve
      - name: wait-for-ssh
        type: shell
        command: |
          echo "Waiting 60s for cloud-init / SSH on the new cluster-B VMs..."
          sleep 60
      - name: install-k3s
        command: ansible playbook k3s -s edge
      - name: deploy-cilium
        command: helmfile apply cilium -s edge

  setup-gpu-os-b:
    description: "Bare-metal edge GPU host (k3s-gpu2) bring-up via Ansible: OS prep, NVIDIA toolkit, join as tainted agent on cluster-B."
    steps:
      - name: prepare-gpu-host
        command: ansible playbook k3s -s edge -- --limit k3s_gpu

  deploy-gpu-b:
    description: "Join k3s-gpu2, install the NVIDIA GPU Operator on edge, then deploy vLLM (VIP 10.10.1.253)."
    steps:
      - name: join-gpu-node
        command: ansible playbook k3s -s edge
      - name: deploy-gpu-operator
        command: helmfile apply gpu-operator -s edge -- --skip-diff-on-install
      - name: deploy-vllm
        command: helmfile apply vllm -s edge -- --skip-diff-on-install

  destroy-cluster-b:
    description: "Tear down cluster-B (removes the pve2 VMs)."
    steps:
      - name: destroy-cilium
        command: helmfile destroy cilium -s edge
        # Best-effort: the cluster may already be gone.
      - name: destroy-vms
        command: terraform destroy proxmox-vms -s edge -auto-approve

  plan-vms-b:
    description: "Plan the cluster-B Proxmox VM changes only."
    steps:
      - name: plan
        command: terraform plan proxmox-vms -s edge
