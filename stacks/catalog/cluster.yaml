# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json
#
# Single source of truth for the cluster. Imported by the deploy stack.
# Vars are scoped per component so each tool receives only what it needs
# (this keeps `atmos terraform` free of undeclared-variable warnings).
#
# Edit THIS file to adapt the cluster to your environment. The node IPs here
# must match components/ansible/k3s/inventory/hosts.yml.

components:
  terraform:
    proxmox-vms:
      metadata:
        component: proxmox-vms
      vars:
        # --- Proxmox ---
        target_node: "pve1"
        template_name: "ubuntu-2404-cloudinit"
        template_id: 0
        datastore_id: "local-lvm"
        snippets_datastore_id: "local"
        ci_user: "ubuntu"
        ssh_public_keys:
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAIvPLEv5/P7zGc833XvRZSc5C4kEIIN0sMzcumHfeR1 rykelley@Ryans-MBP.localdomain"

        # --- Network (control-plane bridged on 10.10.1.0/24) ---
        bridge: "vmbr0"
        vlan_id: 0
        gateway: "10.10.1.1"
        netmask: 24
        dns_servers:
          - "1.1.1.1"
          - "8.8.8.8"
        dns_domain: "lan"

        vm_defaults:
          cores: 2
          sockets: 1
          # 8 GiB (up from 4): the 6 worker/control VMs were memory-maxed once the
          # RAG + monitoring stack landed. The bare-metal GPU node is separate and
          # unaffected by this.
          memory: 8192
          disk_size: 40
          cpu_type: "host"
          os_type: "l26"
          started: true
          on_boot: true
          agent: true

        # --- Nodes (3 servers + 3 agents) ---
        nodes:
          k3s-server-1: { role: "server", ip: "10.10.1.31", vmid: 8101 }
          k3s-server-2: { role: "server", ip: "10.10.1.32", vmid: 8102 }
          k3s-server-3: { role: "server", ip: "10.10.1.33", vmid: 8103 }
          k3s-agent-1: { role: "agent", ip: "10.10.1.34", vmid: 8201 }
          k3s-agent-2: { role: "agent", ip: "10.10.1.35", vmid: 8202 }
          k3s-agent-3: { role: "agent", ip: "10.10.1.36", vmid: 8203 }

  ansible:
    k3s:
      metadata:
        component: k3s
      settings:
        ansible:
          playbook: site.yml
          inventory: inventory/hosts.yml
        depends_on:
          1:
            component: proxmox-vms
      env:
        ANSIBLE_HOST_KEY_CHECKING: "false"
        ANSIBLE_FORCE_COLOR: "true"
      vars:
        k3s_version: "v1.36.2+k3s1"
        kube_vip_version: "v0.8.7"
        kube_vip_interface: "eth0"
        control_plane_vip: "10.10.1.30"
        api_port: 6443
        pod_cidr: "10.42.0.0/16"
        service_cidr: "10.43.0.0/16"
        cluster_dns: "10.43.0.10"

    # Same component dir as `k3s`, different playbook: installs nfs-common on
    # every node without running the rest of the site play. Not part of
    # deploy-cluster (the common role covers it there) — this is for adding NFS
    # storage to a cluster that is already up.
    k3s-nfs-client:
      metadata:
        component: k3s
      settings:
        ansible:
          playbook: nfs-client.yml
          inventory: inventory/hosts.yml
      env:
        ANSIBLE_HOST_KEY_CHECKING: "false"
        ANSIBLE_FORCE_COLOR: "true"

    # Same component dir again: writes /etc/rancher/k3s/registries.yaml so
    # containerd pulls from the in-cluster zot registry over plain HTTP.
    # Restarts k3s on the nodes whose config actually changed.
    k3s-registries:
      metadata:
        component: k3s
      settings:
        ansible:
          playbook: registries.yml
          inventory: inventory/hosts.yml
      env:
        ANSIBLE_HOST_KEY_CHECKING: "false"
        ANSIBLE_FORCE_COLOR: "true"

  helmfile:
    cilium:
      metadata:
        component: cilium
      settings:
        depends_on:
          1:
            component: k3s
      env:
        KUBECONFIG: '{{ env "HOME" }}/.kube/atmos-k3s.yaml'
      vars:
        cilium_chart_version: "1.16.5"
        control_plane_vip: "10.10.1.30"
        api_port: 6443
        pod_cidr: "10.42.0.0/16"
        # North-south ingress + bare-metal LoadBalancer for the filament app.
        enable_gateway_api: true
        # Also serve classic k8s Ingress via Cilium's Envoy (shared entrypoint on
        # 10.10.1.248). The cluster's UIs use Gateway API; this is for future
        # Ingress-based apps. Pool + L2 policy live in gitops/networking.
        enable_ingress_controller: true
        ingress_lb_ip: "10.10.1.248"
        enable_l2_announcements: true
        k8s_client_qps: 15
        k8s_client_burst: 20
        gateway_api_crds_url: "https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/experimental-install.yaml"

    gpu-operator:
      metadata:
        component: gpu-operator
      settings:
        depends_on:
          1:
            component: cilium
      env:
        KUBECONFIG: '{{ env "HOME" }}/.kube/atmos-k3s.yaml'
      vars:
        gpu_operator_namespace: "gpu-operator"
        # v26.x bundles container-toolkit >= v1.18 which supports containerd
        # config version 3 (used by k3s v1.32+/containerd 2.x). Older toolkits
        # crash with "unsupported config version: 3".
        gpu_operator_chart_version: "v26.3.3"
        # Host driver is pre-installed on the Blackwell node, so the operator
        # only manages the toolkit + device plugin (driver.enabled=false in the
        # helmfile). DCGM exporter ships GPU metrics for observability.
        gpu_operator_dcgm_enabled: true
        # Exclusive GPU: one nvidia.com/gpu per physical card. Time-slicing
        # used to share this node with embeddings; that workload belongs on
        # GPU2 (homelab-2 / k3s-gpu2). Re-enable only if two GPU pods must
        # co-schedule on k3s-gpu1 again (and drop vllm_gpu_memory_utilization).
        gpu_timeslicing_enabled: false
        gpu_timeslicing_replicas: 4

    vllm:
      metadata:
        component: vllm
      settings:
        depends_on:
          1:
            component: gpu-operator
      env:
        KUBECONFIG: '{{ env "HOME" }}/.kube/atmos-k3s.yaml'
      vars:
        vllm_namespace: "vllm"
        # Recent vllm/vllm-openai tag with the CUDA 12.8 build required for
        # Blackwell (sm_120). Bump as newer releases land.
        vllm_image_tag: "v0.11.0"
        # Ungated small model that fits comfortably on the RTX 2000 Blackwell.
        # Drop to Qwen/Qwen2.5-1.5B-Instruct if VRAM is tight.
        vllm_model: "Qwen/Qwen2.5-3B-Instruct"
        vllm_max_model_len: 8192
        # Exclusive card (timeslicing off). 0.90 leaves ~1.6 GiB for CUDA
        # context / fragmentation. Drop toward 0.55 only if embeddings share
        # this GPU again.
        vllm_gpu_memory_utilization: "0.90"
        # Extra raw args for the vLLM server. These enable native OpenAI function
        # calling (tool_choice=auto) so Open WebUI's "chat with your cluster" tool
        # server works; the hermes parser matches Qwen2.5's tool-call format.
        vllm_extra_args:
          - "--enable-auto-tool-choice"
          - "--tool-call-parser"
          - "hermes"
        # OpenAI-compatible API served on a dedicated Cilium L2 LoadBalancer IP,
        # clear of the filament gateway (.240) and Hubble UI (.241).
        vllm_lb_ip: "10.10.1.242"
        # L2-announce interface regex. Must match the LAN NIC on WHICHEVER node
        # Cilium elects as the announcer: the Proxmox VMs use eth0, but the
        # bare-metal GPU box (k3s-gpu1) uses eno1. If this only matched eth0 and
        # the GPU node got elected, the VIP would be unreachable (no ARP replies).
        vllm_lb_interface: "(eth0|eno1)"
        # Persist the HuggingFace model cache across pod restarts (0 = emptyDir).
        vllm_model_cache_size: "30Gi"
        # Optional: name of a pre-created Secret with a HF_TOKEN key for gated
        # models. Leave "" for ungated models like Qwen.
        vllm_hf_token_secret: ""

    # Observability stack (Prometheus + Grafana + Loki + Alloy) plus the GPU/vLLM
    # dashboards, DCGM scrape, and LB pools. One helmfile component, four releases.
    # Formerly the monitoring/loki/alloy/monitoring-dashboards Argo CD apps.
    # PREREQUISITE: create the grafana-admin secret out-of-band (see the helmfile
    # header) before the first apply.
    monitoring:
      metadata:
        component: monitoring
      settings:
        depends_on:
          # gpu-operator (which depends on cilium) installs the DCGM exporter the
          # dashboards scrape; cilium provides the LoadBalancer pools.
          1:
            component: gpu-operator
      env:
        KUBECONFIG: '{{ env "HOME" }}/.kube/atmos-k3s.yaml'
      vars:
        monitoring_namespace: "monitoring"
        monitoring_chart_version: "87.17.0"
        loki_chart_version: "7.1.0"
        alloy_chart_version: "1.10.1"
        # The DCGM ServiceMonitor is owned by the kube-prometheus-stack release
        # (prometheus.additionalServiceMonitors). This flag only controls the
        # redundant copy in the monitoring-extras chart; keep it false to avoid a
        # same-name collision on the dcgm-exporter ServiceMonitor.
        monitoring_dcgm_enabled: false
        # Namespace where the GPU Operator runs its DCGM exporter (scrape target).
        monitoring_dcgm_namespace: "gpu-operator"
        # Grafana web UI on a dedicated Cilium L2 LoadBalancer IP.
        monitoring_grafana_lb_ip: "10.10.1.245"
        # Shared classic-Ingress entrypoint (Prometheus ingress rides this). Must
        # match cilium's ingress_lb_ip above.
        monitoring_cilium_ingress_enabled: true
        monitoring_cilium_ingress_lb_ip: "10.10.1.248"
        # L2-announce interface regex. Match the LAN NIC on whichever node Cilium
        # elects as announcer: VMs use eth0, the bare-metal GPU node uses eno1.
        monitoring_lb_interface: "^(eth0|eno1)$"

    hubble-ui:
      metadata:
        component: hubble-ui
      settings:
        depends_on:
          1:
            component: cilium
          # The shared LB IP pool + L2 announcement policy live in the
          # filament-app chart, so that must be applied first.
          2:
            component: filament-app
      env:
        KUBECONFIG: '{{ env "HOME" }}/.kube/atmos-k3s.yaml'
      vars:
        # --- Cilium Gateway L2 LoadBalancer (Hubble UI observability) ---
        hubble_gateway_hostname: ""
        hubble_lb_ip: "10.10.1.241"

    # RWX storage backed by the Synology NAS. `nfs-client` is the cluster
    # default so PVCs without storageClassName land on the NAS (and survive a
    # node loss). local-path stays installed for workloads that pin it
    # explicitly; the helmfile unsets its default annotation so there is only one.
    nfs-provisioner:
      metadata:
        component: nfs-provisioner
      settings:
        depends_on:
          1:
            component: cilium
      env:
        KUBECONFIG: '{{ env "HOME" }}/.kube/atmos-k3s.yaml'
      vars:
        nfs_provisioner_namespace: "nfs-provisioning"
        nfs_provisioner_chart_version: "4.0.18"
        nfs_provisioner_image_tag: "v4.0.2"
        # Synology NAS. `nfs_path` must be an actual export (`showmount -e`),
        # not just a shared folder that exists in DSM.
        nfs_server: "10.10.1.40"
        nfs_path: "/volume1/NFS"
        nfs_storage_class_name: "nfs-client"
        nfs_storage_class_default: true
        nfs_archive_on_delete: false

    kyverno:
      metadata:
        component: kyverno
      settings:
        depends_on:
          1:
            component: cilium
      env:
        KUBECONFIG: '{{ env "HOME" }}/.kube/atmos-k3s.yaml'
      vars:
        kyverno_chart_version: "3.3.4"
        kyverno_policies_chart_version: "3.3.4"
        kyverno_replicas: 3
        kyverno_validation_action: "Audit"
        # Custom policies enforced on the filament application namespace.
        filament_namespace: "filament"
        filament_validation_action: "Enforce"

    filament-app:
      metadata:
        component: filament-app
      settings:
        depends_on:
          1:
            component: kyverno
      env:
        KUBECONFIG: '{{ env "HOME" }}/.kube/atmos-k3s.yaml'
      vars:
        filament_namespace: "filament"
        # --- Images (GHCR). Set image_owner to your GitHub org/user and pin
        # image_tag to a built git SHA (the CI workflow pushes both sha + latest). ---
        image_registry: "ghcr.io"
        image_owner: "rykelley"
        # Release tag pushed by CI (env.IMAGE_VERSION). Kyverno blocks ":latest",
        # so we pin an explicit version.
        image_tag: "v1.0.0"
        # NAME of a docker-registry Secret in the filament namespace (see below).
        # Leave "" if you make the GHCR packages public.
        image_pull_secret: "ghcr"
        # --- Database secret (create out-of-band, see README) ---
        db_secret_name: "filament-db"
        db_secret_key: "DATABASE_URL"
        # --- Cilium Gateway L2 LoadBalancer ---
        gateway_hostname: ""
        gateway_lb_ip: "10.10.1.240"
        # Only the two Gateway services live here (filament .240, hubble-ui .241).
        # Keep this block narrow: dedicated single-IP pools own .242 (vLLM) and
        # .245 (grafana, in the monitoring-extras chart). Cilium flags pools whose
        # IP ranges OVERLAP as conflicting (regardless of serviceSelector), so a
        # wide .240-.250 block here would disable those dedicated pools.
        gateway_lb_start: "10.10.1.240"
        gateway_lb_stop: "10.10.1.241"
        # Match the LAN NIC on any elected announcer: VMs use eth0, the bare-metal
        # GPU node (k3s-gpu1) uses eno1. See vllm_lb_interface for the full rationale.
        gateway_interface: "(eth0|eno1)"
        # --- Network policy ---
        network_policy_enabled: true
        # Supabase's direct host (db.<ref>.supabase.co) is IPv6-only, which the
        # IPv4 pod network can't reach. Use the connection pooler (IPv4) on 6543.
        supabase_port: 6543
