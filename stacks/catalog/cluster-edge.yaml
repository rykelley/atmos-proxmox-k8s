# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json
#
# Single source of truth for cluster-B ("edge") — the second k3s cluster on
# standalone Proxmox host pve2 (API at 10.10.1.82), plus bare-metal GPU node
# k3s-gpu2 (10.10.1.39) for vLLM. Shares the flat 10.10.1.0/24 LAN with prod;
# node IPs (.51-.56) and LB VIPs (.251/.253) stay clear of hub's ranges.
#
# Each cluster is deployed independently with plain atmos + ansible + helmfile
# (no Argo CD / Kargo). Apply with `atmos ... -s edge`.

components:
  terraform:
    proxmox-vms:
      metadata:
        component: proxmox-vms
      env:
        # cluster-B is a STANDALONE Proxmox host with its own API endpoint/token.
        # The bpg/proxmox provider reads these from the environment; scoping them
        # to this component keeps `-s prod` on the ambient PROXMOX_VE_* from .env.
        # Populate PROXMOX_VE_B_* in your .env (see .env.example).
        PROXMOX_VE_ENDPOINT: '{{ env "PROXMOX_VE_B_ENDPOINT" | default "https://10.10.1.82:8006/" }}'
        PROXMOX_VE_API_TOKEN: '{{ env "PROXMOX_VE_B_API_TOKEN" }}'
        PROXMOX_VE_INSECURE: "true"
        PROXMOX_VE_SSH_USERNAME: "root"
      vars:
        # --- Proxmox (standalone host pve2) ---
        target_node: "pve2"
        template_name: "ubuntu-2404-cloudinit"
        template_id: 9000
        datastore_id: "local-lvm"
        snippets_datastore_id: "local"
        ci_user: "ubuntu"
        ssh_public_keys:
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAIvPLEv5/P7zGc833XvRZSc5C4kEIIN0sMzcumHfeR1 rykelley@Ryans-MBP.localdomain"

        # --- Network (bridged on 10.10.1.0/24, same LAN as cluster-A) ---
        bridge: "vmbr0"
        vlan_id: 0
        gateway: "10.10.1.1"
        netmask: 24
        dns_servers:
          - "1.1.1.1"
          - "8.8.8.8"
        dns_domain: "lan"

        vm_defaults:
          cores: 2
          sockets: 1
          # 8 GiB (up from 4): cluster-A mirrors at 4 GiB, but cluster-B runs the
          # promoted model on CPU (no GPU offload), so it needs real host RAM for
          # model weights + the CPU KV cache. 4 GiB could not even schedule vLLM.
          memory: 8192
          disk_size: 40
          cpu_type: "host"
          os_type: "l26"
          started: true
          on_boot: true
          agent: true

        # --- Nodes: 3-server HA + 3 agents (Proxmox VMs). Bare-metal GPU
        # k3s-gpu2 (10.10.1.39) is NOT here — joined via Ansible inventory. ---
        nodes:
          edge-server-1: { role: "server", ip: "10.10.1.51", vmid: 8301 }
          edge-server-2: { role: "server", ip: "10.10.1.52", vmid: 8302 }
          edge-server-3: { role: "server", ip: "10.10.1.53", vmid: 8303 }
          edge-agent-1: { role: "agent", ip: "10.10.1.54", vmid: 8401 }
          edge-agent-2: { role: "agent", ip: "10.10.1.55", vmid: 8402 }
          edge-agent-3: { role: "agent", ip: "10.10.1.56", vmid: 8403 }

  ansible:
    k3s:
      metadata:
        component: k3s
      settings:
        ansible:
          playbook: site.yml
          # inventory (3 servers + 3 agents + bare-metal k3s-gpu2).
          inventory: inventory/hosts-edge.yml
        depends_on:
          1:
            component: proxmox-vms
      env:
        ANSIBLE_HOST_KEY_CHECKING: "false"
        ANSIBLE_FORCE_COLOR: "true"
      vars:
        k3s_version: "v1.36.2+k3s1"
        # First edge server node IP (no floating VIP / kube-vip).
        control_plane_endpoint: "10.10.1.51"
        kube_vip_legacy_ips:
          - "10.10.1.50"
        kube_vip_interface: "eth0"
        api_port: 6443
        pod_cidr: "10.42.0.0/16"
        service_cidr: "10.43.0.0/16"
        cluster_dns: "10.43.0.10"
        # Write cluster-B's kubeconfig to its OWN path so both clusters can be
        # managed side by side (helmfile below points KUBECONFIG here too).
        kubeconfig_local_path: '{{ env "HOME" }}/.kube/atmos-k3s-edge.yaml'

    # One-shot cleanup for leftover kube-vip on cluster-B (see prod catalog).
    k3s-remove-kube-vip:
      metadata:
        component: k3s
      settings:
        ansible:
          playbook: remove-kube-vip.yml
          inventory: inventory/hosts-edge.yml
      env:
        ANSIBLE_HOST_KEY_CHECKING: "false"
        ANSIBLE_FORCE_COLOR: "true"
      vars:
        control_plane_endpoint: "10.10.1.51"
        kube_vip_legacy_ips:
          - "10.10.1.50"
        kube_vip_interface: "eth0"
        api_port: 6443
        kubeconfig_local_path: '{{ env "HOME" }}/.kube/atmos-k3s-edge.yaml'

    # See the prod catalog: narrow NFS-client install against cluster-B's nodes.
    k3s-nfs-client:
      metadata:
        component: k3s
      settings:
        ansible:
          playbook: nfs-client.yml
          inventory: inventory/hosts-edge.yml
      env:
        ANSIBLE_HOST_KEY_CHECKING: "false"
        ANSIBLE_FORCE_COLOR: "true"

    # See the prod catalog: point cluster-B's containerd at the zot registry
    # running on cluster-A (10.10.1.252:5000, reachable across the flat LAN).
    k3s-registries:
      metadata:
        component: k3s
      settings:
        ansible:
          playbook: registries.yml
          inventory: inventory/hosts-edge.yml
      env:
        ANSIBLE_HOST_KEY_CHECKING: "false"
        ANSIBLE_FORCE_COLOR: "true"

  helmfile:
    cilium:
      metadata:
        component: cilium
      settings:
        depends_on:
          1:
            component: k3s
      env:
        KUBECONFIG: '{{ env "HOME" }}/.kube/atmos-k3s-edge.yaml'
      vars:
        cilium_chart_version: "1.16.5"
        control_plane_endpoint: "10.10.1.51"
        api_port: 6443
        pod_cidr: "10.42.0.0/16"
        # No Gateway API / Ingress on cluster-B (no north-south UI ingress), but
        # keep L2 announcements so vLLM can claim an L2 LB IP.
        enable_gateway_api: false
        enable_ingress_controller: false
        enable_l2_announcements: true
        k8s_client_qps: 15
        k8s_client_burst: 20
        gateway_api_crds_url: "https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/experimental-install.yaml"

    gpu-operator:
      metadata:
        component: gpu-operator
      settings:
        depends_on:
          1:
            component: cilium
      env:
        KUBECONFIG: '{{ env "HOME" }}/.kube/atmos-k3s-edge.yaml'
      vars:
        gpu_operator_namespace: "gpu-operator"
        gpu_operator_chart_version: "v26.3.3"
        gpu_operator_dcgm_enabled: true
        # Exclusive card on k3s-gpu2 (same as hub).
        gpu_timeslicing_enabled: false
        gpu_timeslicing_replicas: 4

    # Same NAS export and layout as cluster-A. NOTE: both clusters therefore
    # write into /volume1/NFS under <namespace>/<pvc>, so a PVC with the same
    # namespace AND name on both clusters (e.g. monitoring/*) resolves to one
    # shared directory. Give cluster-B its own export or pathPattern prefix if
    # that ever stops being acceptable.
    nfs-provisioner:
      metadata:
        component: nfs-provisioner
      settings:
        depends_on:
          1:
            component: cilium
      env:
        KUBECONFIG: '{{ env "HOME" }}/.kube/atmos-k3s-edge.yaml'
      vars:
        nfs_provisioner_namespace: "nfs-provisioning"
        nfs_provisioner_chart_version: "4.0.18"
        nfs_provisioner_image_tag: "v4.0.2"
        nfs_server: "10.10.1.40"
        nfs_path: "/volume1/NFS"
        nfs_storage_class_name: "nfs-client"
        nfs_storage_class_default: true
        nfs_archive_on_delete: false

    # GPU inference on k3s-gpu2 (10.10.1.39). Same chart/model as cluster-A
    # vLLM so both exclusive Blackwells are interchangeable OpenAI backends.
    # LAN VIP 10.10.1.253 (was the Ollama experiment). Do not use .242 — that
    # ARP is a UniFi switch, not cluster-A's Cilium pool.
    vllm:
      metadata:
        component: vllm
      settings:
        depends_on:
          1:
            component: gpu-operator
      env:
        KUBECONFIG: '{{ env "HOME" }}/.kube/atmos-k3s-edge.yaml'
      vars:
        vllm_namespace: "vllm"
        vllm_image_tag: "v0.11.0"
        vllm_model: "Qwen/Qwen2.5-3B-Instruct"
        vllm_max_model_len: 8192
        vllm_gpu_memory_utilization: "0.90"
        vllm_extra_args:
          - "--enable-auto-tool-choice"
          - "--tool-call-parser"
          - "hermes"
        vllm_lb_ip: "10.10.1.253"
        vllm_lb_interface: "(eth0|eno1|eno4)"
        vllm_model_cache_size: "30Gi"
        vllm_model_cache_storage_class: "local-path"
        vllm_hf_token_secret: ""

    # Edge slice of the monitoring stack: a Prometheus-ONLY kube-prometheus-stack
    # (Grafana/Loki/Alloy disabled) that scrapes this cluster's nodes, kube-state,
    # DCGM (GPU), and vLLM, then exposes itself on LAN LB 10.10.1.251. The hub
    # (homelab-1) Grafana adds it as the Prometheus-edge datasource, so a single
    # Grafana covers both clusters. Same `monitoring` component as the hub, just
    # reshaped by the vars below. Applied with `atmos helmfile apply monitoring -s edge`.
    monitoring:
      metadata:
        component: monitoring
      settings:
        depends_on:
          # cilium provides the L2 LoadBalancer pool for the .251 VIP. The GPU
          # Operator's DCGM exporter (namespace gpu-operator) is already running.
          1:
            component: cilium
      env:
        KUBECONFIG: '{{ env "HOME" }}/.kube/atmos-k3s-edge.yaml'
      vars:
        monitoring_namespace: "monitoring"
        monitoring_chart_version: "87.17.0"
        # Prometheus-only shape: select the edge values, disable the hub-only
        # releases (Grafana/Loki/Alloy) and dashboards.
        monitoring_kps_values: "values/kube-prometheus-stack-edge.yaml"
        monitoring_loki_enabled: false
        monitoring_alloy_enabled: false
        monitoring_dashboards_enabled: false
        # DCGM + vLLM ServiceMonitors are defined in the edge kps values, so keep
        # the extras chart's redundant DCGM copy off.
        monitoring_dcgm_enabled: false
        monitoring_dcgm_namespace: "gpu-operator"
        # monitoring-extras runs here ONLY to create the Prometheus LB pool; no
        # Grafana pool and no cilium-ingress pool on the edge.
        monitoring_extras_enabled: true
        monitoring_grafana_lb_enabled: false
        monitoring_cilium_ingress_enabled: false
        monitoring_prometheus_lb_enabled: true
        monitoring_prometheus_lb_ip: "10.10.1.251"
        # L2-announce NIC regex: edge VMs use eth0, the edge GPU node (k3s-gpu2)
        # announces on eno4.
        monitoring_lb_interface: "^(eth0|eno1|eno4)$"
