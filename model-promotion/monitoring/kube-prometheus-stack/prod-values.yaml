# Prod (homelab-2) — kube-prometheus-stack values.
# Chart: prometheus-community/kube-prometheus-stack 87.17.0 (same pin as staging).
#
# Grafana DISABLED — unified UI is staging Grafana with Prometheus-prod DS.
# Phase 3 exposes Prometheus on Cilium LB 10.10.1.249 for cross-cluster scrape UI.

grafana:
  enabled: false

alertmanager:
  enabled: true

prometheus:
  service:
    type: LoadBalancer
    annotations:
      io.cilium/lb-ipam-ips: "10.10.1.249"
  ingress:
    enabled: true
    ingressClassName: cilium
    hosts:
      - prometheus-prod.rykelley.com
    paths:
      - /
    pathType: Prefix
    # Optional once Ingress exists; primary path is LB .249 above.
  prometheusSpec:
    retention: 7d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # Allow Grafana on staging (and LAN browsers) to query this Prometheus.
    # Homelab trust boundary = LAN; tighten later if needed.
    enableRemoteWriteReceiver: false
    externalUrl: http://10.10.1.249:9090
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

  additionalServiceMonitors:
    - name: dcgm-exporter
      namespaceSelector:
        matchNames:
          - gpu-operator
      selector:
        matchLabels:
          app: nvidia-dcgm-exporter
      endpoints:
        - port: gpu-metrics
          interval: 15s
