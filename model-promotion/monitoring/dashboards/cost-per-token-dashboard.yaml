# Cost-per-token — GPU wattage × $/kWh ÷ generation tokens (variable electricity_rate_usd_per_kwh).
# Sidecar-imported via label grafana_dashboard=1 (NAMESPACE=ALL).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cost-per-token-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: cost-per-token-dashboard
    app.kubernetes.io/part-of: model-promotion
data:
  cost-per-token.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "model-promotion",
        "cost",
        "gpu",
        "phase3"
      ],
      "title": "Cost per Token (electricity)",
      "uid": "cost-per-token",
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            },
            "includeAll": false,
            "hide": 0,
            "refresh": 1
          },
          {
            "name": "electricity_rate_usd_per_kwh",
            "type": "constant",
            "label": "$/kWh",
            "current": {
              "text": "0.14",
              "value": "0.14"
            },
            "query": "0.14",
            "hide": 0
          },
          {
            "name": "namespace",
            "type": "textbox",
            "label": "vLLM namespace",
            "current": {
              "text": "vllm-promo",
              "value": "vllm-promo"
            },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Est. $/token (selected range)",
          "description": "avg(power_W)*hours/1000*$/kWh / tokens. Uses dashboard range.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "(avg_over_time(DCGM_FI_DEV_POWER_USAGE[$__range]) * ($__range_s / 3600) / 1000 * $electricity_rate_usd_per_kwh) / clamp_min(sum(increase(vllm:generation_tokens_total{namespace=\"$namespace\"}[$__range])), 1)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 8
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Est. electricity $ (selected range)",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "avg_over_time(DCGM_FI_DEV_POWER_USAGE[$__range]) * ($__range_s / 3600) / 1000 * $electricity_rate_usd_per_kwh"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 4
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Tokens generated (selected range)",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(increase(vllm:generation_tokens_total{namespace=\"$namespace\"}[$__range]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "GPU power (W)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "DCGM_FI_DEV_POWER_USAGE",
              "legendFormat": "watts {{gpu}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "spanNulls": false
              },
              "unit": "watt"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Generation tokens / sec",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(rate(vllm:generation_tokens_total{namespace=\"$namespace\"}[5m]))",
              "legendFormat": "tokens/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "spanNulls": false
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Instantaneous $/token (5m window)",
          "description": "avg power over 5m \u2192 kWh \u2192 $ / tokens in 5m. Spikes when token rate is near zero.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "(avg_over_time(DCGM_FI_DEV_POWER_USAGE[5m]) * (5/60) / 1000 * $electricity_rate_usd_per_kwh) / clamp_min(sum(increase(vllm:generation_tokens_total{namespace=\"$namespace\"}[5m])), 1)",
              "legendFormat": "$/token"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 8,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          }
        }
      ]
    }
