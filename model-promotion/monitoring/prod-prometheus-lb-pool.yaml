# Apply on homelab-2 ONLY (prod). Gives Prometheus a stable LAN VIP for the
# staging Grafana Prometheus-prod datasource.
#
#   kubectl --context homelab-2 apply -f model-promotion/monitoring/prod-prometheus-lb-pool.yaml
#
# Then helm-upgrade monitoring with updated prod-values.yaml (LoadBalancer .249).
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: prometheus-prod-lb-pool
  labels:
    app.kubernetes.io/part-of: model-promotion
spec:
  blocks:
    - start: "10.10.1.249"
      stop: "10.10.1.249"
  serviceSelector:
    matchLabels:
      # Labels present on the kube-prometheus-stack Prometheus Service
      # (metadata.labels — not the pod selector).
      app: kube-prometheus-stack-prometheus
      release: monitoring
      app.kubernetes.io/instance: monitoring
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: prometheus-prod-lb-pool
  labels:
    app.kubernetes.io/part-of: model-promotion
spec:
  serviceSelector:
    matchLabels:
      app: kube-prometheus-stack-prometheus
      release: monitoring
      app.kubernetes.io/instance: monitoring
  interfaces:
    - "^(eth0|eno1)$"
  loadBalancerIPs: true
