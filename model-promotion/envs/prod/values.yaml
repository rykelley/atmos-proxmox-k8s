# Prod (homelab-2) — Gemma 4 26B A4B MoE at 4-bit for 16GB VRAM.
#
# Deployed only via gitops/apps/vllm-promo-prod.yaml after an explicit Sync
# confirmation (Application has automated sync OFF).
#
# VRAM: Google Q4_0 ≈ 14.4 GiB weights; maxModelLen 4096 + util 0.92 leave slim
# KV headroom. Watch DCGM_FI_DEV_FB_USED and vllm:kv_cache_usage_perc after sync.
namespace: vllm-promo
appName: vllm-promo

image:
  repository: vllm/vllm-openai
  tag: "gemma4"
  digest: "sha256:8e86cb93b724092cd4dc892fb129a6c5538613b38a5cd34e40aab9e6aea72b03"
  pullPolicy: IfNotPresent

model:
  name: "google/gemma-4-26B-A4B-it"
  maxModelLen: 4096
  gpuMemoryUtilization: "0.92"
  quantization: "bitsandbytes"
  extraArgs: []

gpu:
  count: 1

resources:
  requests:
    cpu: "4"
    memory: 16Gi
  limits:
    cpu: "8"
    memory: 28Gi

modelCache:
  size: "80Gi"
  storageClassName: local-path

hfTokenSecret: ""

serviceMonitor:
  enabled: true
