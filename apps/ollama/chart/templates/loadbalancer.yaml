# Dedicated Cilium LoadBalancer IPAM + L2 announcement for the Ollama Service.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: {{ .Values.loadBalancer.poolName }}
  labels:
    {{- include "ollama.labels" (dict "name" "ollama-lb-pool" "component" "networking" "root" $) | nindent 4 }}
spec:
  blocks:
    - start: {{ .Values.loadBalancer.ip | quote }}
      stop: {{ .Values.loadBalancer.ip | quote }}
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
      app.kubernetes.io/part-of: ollama
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: {{ .Values.loadBalancer.poolName }}
  labels:
    {{- include "ollama.labels" (dict "name" "ollama-l2-announce" "component" "networking" "root" $) | nindent 4 }}
spec:
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
      app.kubernetes.io/part-of: ollama
  interfaces:
    - {{ printf "^%s$" .Values.loadBalancer.interface | quote }}
  loadBalancerIPs: true
