# PROD values (cluster-B, CPU) — the promotion TARGET of the Kargo pipeline.
#
# A plain Deployment serving a tiny CPU model, exposed on the LAN at 10.10.1.246.
# Kargo pins the prod Argo CD app's targetRevision to the SAME Freight commit the
# staging canary verified, so prod deploys this file at that commit.
#
# Uses the official CPU image (vllm/vllm-openai-cpu), which auto-detects the CPU
# platform. Sized for cluster-B's 2-core / 8 GiB nodes: modest requests + a
# capped CPU KV cache (VLLM_CPU_KVCACHE_SPACE) so weights + cache fit in RAM.
namespace: vllm-pipeline
image:
  repository: vllm/vllm-openai-cpu
  tag: "v0.26.0-x86_64"
model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  maxModelLen: 2048
gpu:
  enabled: false
replicas: 1
resources:
  requests:
    cpu: "1"
    memory: 3Gi
  limits:
    cpu: "2"
    memory: 6Gi
# tmpfs /dev/shm counts against pod memory; keep it small on CPU.
shmSize: 1Gi
# Cap the CPU KV cache (GiB) so weights + cache stay within the limit.
extraEnv:
  - name: VLLM_CPU_KVCACHE_SPACE
    value: "2"
service:
  type: LoadBalancer
loadBalancer:
  enabled: true
  ip: "10.10.1.246"
  interface: "eth0"
rollout:
  enabled: false
analysis:
  enabled: false
