apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vllm-pipeline.labels" . | nindent 4 }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.loadBalancer.ip }}
  annotations:
    io.cilium/lb-ipam-ips: {{ .Values.loadBalancer.ip | quote }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "vllm-pipeline.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
