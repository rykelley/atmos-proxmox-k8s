{{- if .Values.rollout.enabled }}
# Argo Rollouts canary path (the GPU staging cluster). The Rollout manages a
# single Service (no mesh/ingress traffic routing here), so canary traffic is
# split by pod ratio. Each `pause` gives the AnalysisTemplate time to judge the
# canary before the next weight step.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vllm-pipeline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "vllm-pipeline.selectorLabels" . | nindent 6 }}
  template:
    {{- include "vllm-pipeline.podTemplate" . | nindent 4 }}
  strategy:
    canary:
      {{- if .Values.analysis.enabled }}
      # Run background analysis starting after the first weight step; a failed
      # run aborts the rollout and keeps the stable version serving.
      analysis:
        templates:
          - templateName: {{ .Values.appName }}-canary
        startingStep: 1
      {{- end }}
      steps:
        {{- toYaml .Values.rollout.canary.steps | nindent 8 }}
{{- if eq (include "vllm-pipeline.persistModelCache" .) "true" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.appName }}-model-cache
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vllm-pipeline.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.modelCache.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.modelCache.size | quote }}
{{- end }}
{{- end }}
