# Dedicated Cilium LoadBalancer IPAM + L2 announcement for Garage S3.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: {{ .Values.loadBalancer.poolName }}
  labels:
    {{- include "garage.labels" (dict "name" "garage-lb-pool" "component" "networking") | nindent 4 }}
spec:
  blocks:
    - start: {{ .Values.loadBalancer.ip | quote }}
      stop: {{ .Values.loadBalancer.ip | quote }}
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: garage
      app.kubernetes.io/part-of: garage
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: {{ .Values.loadBalancer.poolName }}
  labels:
    {{- include "garage.labels" (dict "name" "garage-l2-announce" "component" "networking") | nindent 4 }}
spec:
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: garage
      app.kubernetes.io/part-of: garage
  interfaces:
    - {{ .Values.loadBalancer.interface | quote }}
  loadBalancerIPs: true
